name: .NET

on:
  push:
    branches:
      - task13
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore practice2026.slnx

      - name: Build
        run: dotnet build practice2026.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test practice2026.slnx --configuration Release --no-build --verbosity normal